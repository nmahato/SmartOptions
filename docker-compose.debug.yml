services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: smartoptions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Syntel@01
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./Database/Script.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
      - "5678:5678"
    environment:
      - DEBUG=1
      - DB_NAME=smartoptions
      - DB_USER=postgres
      - DB_PASSWORD=Syntel@01
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    command: python debug_server.py

  angular-frontend:
    build: ./angular-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data: