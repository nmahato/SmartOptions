version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smartoptions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Syntel@01
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/Script.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_NAME=smartoptions
      - DB_USER=postgres
      - DB_PASSWORD=Syntel@01
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  celery:
    build: ./backend
    command: celery -A smartoptions worker -l info
    environment:
      - DB_NAME=smartoptions
      - DB_USER=postgres
      - DB_PASSWORD=Syntel@01
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "19006:19006"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  angular-frontend:
    build: ./angular-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data: